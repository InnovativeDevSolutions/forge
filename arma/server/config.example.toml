# Forge Arma server extension configuration.
#
# Copy this file to `config.toml` beside `forge_server_x64.dll`, or use the
# shared config generated from `bin/host/config.example.toml`.
#
# The Arma extension reads only the [api] section. Extra host/ICOM sections in
# a shared config are ignored by the extension.

[api]
# The standalone forge-webapi: the extension's only persistence backend.
# All actor, bank, org, phone, garage, locker, virtual garage and virtual
# locker persistence goes through the API. Make sure the API is running
# first (in forge-webapi: `docker compose up`, then
# `curl localhost:8080/health`). If the API is down, saves fail and are
# logged; nothing is written anywhere else.
base_url = "http://127.0.0.1:8080"

# Per-request timeout in milliseconds.
timeout_ms = 5000
