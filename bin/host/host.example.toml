[server]
host = "0.0.0.0"
port = 9090

[surreal]
endpoint = "127.0.0.1:8000"
namespace = "forge"
database = "main"
username = "root"
password = "root"
connect_timeout_ms = 5000

[surrealdb]
enabled = true
command = "surreal"
args = ["start", "--user", "root", "--pass", "root", "--bind", "127.0.0.1:8000", "rocksdb://forge.db"]
working_dir = "../../arma/server/surrealdb"
health_host = "127.0.0.1"
health_port = 8000

[icom]
enabled = true
command = "target/release/forge-icom.exe"
args = []
working_dir = "../.."
health_host = "127.0.0.1"
health_port = 9090

[arma]
enabled = false
command = "arma3server_x64.exe"
args = ["-port=2302", "-profiles=serverprofiles", "-name=server", "-noBattlEye"]
working_dir = ""
health_host = "127.0.0.1"
health_port = 2302
